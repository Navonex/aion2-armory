[project]
name = "aion2-armory"
version = "0.1.0"
description = "AION 2 Armory: Charaktere der Gilde, Verlauf, Vergleich und Build-Check"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["armory_api"]
